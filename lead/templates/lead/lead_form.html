{% extends 'core/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="py-6 px-6" style="max-width: 820px;">
  <h1 class="text-xl font-bold mb-4">{{ title }}</h1>
  <div class="card p-4">
    <form method="post" action="." class="grid-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary mt-2" style="grid-column: 1 / -1; justify-self: start;">Guardar</button>
    </form>
  </div>
</div>
{% endblock %}
