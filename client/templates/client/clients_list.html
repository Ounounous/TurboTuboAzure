{% extends 'core/base.html' %}

{% block title %}Clients{% endblock %}

{% block content %}
    <div class="py-6 px-6">
        <h1 class="mb-4 text-xl">Clientes</h1>

        <a href="{% url 'clients:add' %}" class="btn btn-primary">Agregar Cliente</a>
        <a href="{% url 'clients:export' %}" class="btn btn-primary">Export Clients</a>

        {% if clients %}
            <div class="mt-6 flex justify-between">
                <p class="list-head py-4 px-2 w-full">Name</p>
               
            </div>

            {% for client in clients %}
                <div class="flex justify-between">
                    <p class="py-2 px-2 w-full {% cycle '' 'row-alt' %}">
                        <a href="{% url 'clients:detail' client.id %}">{{ client.name }}</a>
                    </p>
                </div>
            {% empty %}
                
            {% endfor %}
        {% else %}
            <p class="mt-6 px-2">No existen clientes asignados</p>
        {% endif %}
    </div>
{% endblock %}
