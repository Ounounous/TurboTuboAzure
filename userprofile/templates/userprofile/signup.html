{% extends 'core/base.html' %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
  <div class="py-10 px-4 flex justify-center">
    <div class="card p-6" style="width:100%; max-width:400px;">
      <h1 class="mb-4 text-xl font-bold">Crear cuenta</h1>
      <form method="post" action=".">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary mt-4" style="width:100%;">Crear cuenta</button>
      </form>
    </div>
  </div>
{% endblock %}
