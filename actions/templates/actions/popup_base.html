{% load static %}
<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'main.min.css' %}">
    <title>{% block title %}Gestión{% endblock %}</title>
</head>
<body>
    {% if messages %}
        <div class="py-4 px-4">
            {% for message in messages %}
                <div class="py-2 px-4 bg-teal-300 text-white rounded-xl mb-2">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}
    {% endblock %}
</body>
</html>
