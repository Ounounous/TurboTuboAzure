{% load static %}
<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('tt-palette'); } catch (e) {}
            document.documentElement.setAttribute('data-theme', saved || 'azul-claro');
        })();
    </script>
    <link rel="stylesheet" href="{% static 'main.min.css' %}?v={{ asset_v }}">
    <link rel="stylesheet" href="{% static 'theme.css' %}?v={{ asset_v }}">
    <title>{% block title %}Gestión{% endblock %}</title>
</head>
<body>
    {% if messages %}
        <div class="py-4 px-4">
            {% for message in messages %}
                <div class="alert alert-info mb-2">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}
    {% endblock %}

    {% include 'core/partials/_note_modal.html' %}
</body>
</html>
