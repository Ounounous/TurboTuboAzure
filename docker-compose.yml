services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: turbotubo
      POSTGRES_USER: turbotubo
      POSTGRES_PASSWORD: turbotubo
    ports:
      # Solo loopback: sin esto, Docker Desktop publica en 0.0.0.0 y salta el firewall de
      # Windows (NAT de WSL2/Hyper-V), exponiendo Postgres con password trivial a toda la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - turbotubo_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  turbotubo_pgdata:
